name: tk_pelanggan
description: >-
  Tuntaskilat — Aplikasi Pelanggan (Android). Layar OB1-OB3 + P1-P15,
  lihat page-inventory.md.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  tk_core: ^0.1.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.0.0
  geolocator: ^14.0.0
  image_picker: ^1.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# Splash native — Android <12 pakai windowBackground, Android 12+ pakai
# SplashScreen API sistem (ikon dalam lingkaran). Sumber di tool/brand_src
# TIDAK ikut ke bundle (hanya input generator). Regenerate dengan:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: tool/brand_src/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: tool/brand_src/splash_icon_a12.png
  android: true
  ios: false
  web: false

# Icon launcher (adaptive + legacy) dari brandmark petir — sesuai
# design-tokens.md § Logo & Brandmark. Regenerate dengan:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/brand_src/icon_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: tool/brand_src/icon_adaptive_foreground.png
