<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Panel Admin Tuntaskilat — kelola pesanan, kru, dan layanan kebersihan on-demand Kota Sampit.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tuntaskilat Admin">
  <meta name="theme-color" content="#0A874D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tuntaskilat — Panel Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash bermerek selama Flutter web memuat — hilangkan layar putih
       kosong (perbaikan performa terasa). Dihapus otomatis saat app siap. */
    body { margin: 0; }
    #tk-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #EAF4EE 0%, #FFFFFF 55%);
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #tk-loading img { width: 168px; height: auto; }
    #tk-loading .t { margin-top: 18px; font-size: 22px; font-weight: 700;
      color: #10251A; letter-spacing: -0.3px; }
    #tk-loading .s { margin-top: 4px; font-size: 13px; color: #5B665F; }
    #tk-loading .ring {
      margin-top: 26px; width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(10,135,77,.2); border-top-color: #0A874D;
      animation: tkspin .8s linear infinite;
    }
    @keyframes tkspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="tk-loading">
    <img src="icons/logo-color.png" alt="Tuntaskilat">
    <div class="t">Tuntaskilat</div>
    <div class="s">Panel Admin · PT Tuntas Kilat Group</div>
    <div class="ring"></div>
  </div>

  <script>
    // Sembunyikan splash setelah Flutter menggambar frame pertama.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('tk-loading');
      if (el) { el.style.opacity = '0';
        setTimeout(function(){ el.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
